<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профил - generation zef</title>
    <link rel="stylesheet" href="new 1.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%3E%3Ctext%20y%3D%2714%27%20font-size%3D%2716%27%3E%F0%9F%8C%B8%3C%2Ftext%3E%3C%2Fsvg%3E">
    <style>
        .profile-wrap { max-width: 860px; margin: 40px auto; padding: 0 20px; }
        .profile-card { background: #fff; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.09); padding: 30px; margin-bottom: 28px; }
        .profile-card h2 { font-size: 22px; color: #d32f2f; margin: 0 0 18px 0; border-bottom: 2px solid #f5f5f5; padding-bottom: 10px; }
        .order-entry { border: 1px solid #eee; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
        .order-entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; color: #666; }
        .order-entry-header strong { color: #333; font-size: 16px; }
        .order-items-list { list-style: none; padding: 0; margin: 0; }
        .order-items-list li { font-size: 14px; color: #555; padding: 3px 0; border-bottom: 1px solid #f9f9f9; }
        .order-items-list li:last-child { border-bottom: none; }
        .order-total { text-align: right; font-weight: bold; color: #d32f2f; font-size: 15px; margin-top: 8px; }
        .cart-current-item { display: flex; justify-content: space-between; font-size: 14px; color: #555; padding: 6px 0; border-bottom: 1px solid #f5f5f5; }
        .cart-current-item:last-child { border-bottom: none; }
        .profile-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
        .no-data { color: #999; font-style: italic; text-align: center; padding: 20px 0; }
        .guest-prompt { text-align: center; padding: 60px 20px; }
        .guest-prompt p { font-size: 17px; color: #666; margin-bottom: 20px; }
        .username-badge { font-size: 28px; font-weight: bold; color: #d32f2f; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="new 1.html" class="logo">🌹 generation zef</a>
            <nav>
                <ul>
                    <li><a href="new 1.html">БУКЕТИ</a></li>
                    <li><a href="за нас.html">ЗА НАС</a></li>
                    <li><a href="contact.html">КОНТАКТ</a></li>
                    <li><a href="info.html">ИНФО</a></li>
                </ul>
            </nav>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Преглед на продукти...">
            </div>
            <div class="auth-icon" onclick="toggleAuth()">
                <span id="user-name"></span> 👤
            </div>
            <a href="cart.html" class="cart-icon">
                <span class="cart-count">0</span>
                🛒
            </a>
        </header>

        <div class="profile-wrap">
            <div id="guest-view" class="profile-card guest-prompt" style="display:none;">
                <p>Трябва да сте влезли в профил, за да видите тази страница.</p>
                <button class="cta-button" onclick="toggleAuth()">Вход / Регистрация</button>
            </div>

            <div id="user-view" style="display:none;">
                <div class="profile-card">
                    <div class="username-badge" id="profile-username"></div>
                    <p style="color:#666; margin:4px 0 16px 0;">Добре дошли в профила ви</p>
                    <div class="profile-actions">
                        <a href="new 1.html" class="cta-button">Към магазина</a>
                        <button class="cta-button" style="background:#777;" onclick="doLogout()">Изход</button>
                    </div>
                </div>

                <div class="profile-card">
                    <h2>🛒 Текуща количка</h2>
                    <div id="profile-cart-body"></div>
                </div>

                <div class="profile-card">
                    <h2>📦 История на поръчките</h2>
                    <div id="profile-orders-body"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        function updateCart() {
            const count = cart.reduce((t, i) => t + i.quantity, 0);
            const counter = document.querySelector('.cart-count');
            if (counter) counter.textContent = count;
        }
        updateCart();

        function renderProfileCart(user) {
            const body = document.getElementById('profile-cart-body');
            if (!cart.length) {
                body.innerHTML = '<p class="no-data">Количката е празна.</p>';
                return;
            }
            let total = 0;
            const items = cart.map(item => {
                const lineTotal = item.price * item.quantity;
                total += lineTotal;
                return `<div class="cart-current-item"><span>${item.name} x ${item.quantity}</span><span>${lineTotal.toFixed(2)} лв</span></div>`;
            }).join('');
            body.innerHTML = items + `<div class="order-total">Общо: ${total.toFixed(2)} лв</div>
                <div class="profile-actions" style="margin-top:14px;"><a href="cart.html" class="cta-button">Към количката</a></div>`;
        }

        function renderOrderHistory(user) {
            const body = document.getElementById('profile-orders-body');
            const key = 'ordersHistory_' + user;
            const history = JSON.parse(localStorage.getItem(key) || '[]');

            if (!history.length) {
                body.innerHTML = '<p class="no-data">Все още нямате завършени поръчки.</p>';
                return;
            }

            body.innerHTML = history.map((order, idx) => {
                const date = new Date(order.createdAt || Date.now()).toLocaleDateString('bg-BG', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                const itemRows = (order.items || []).map(item =>
                    `<li>${item.name} x ${item.quantity} — ${(item.price * item.quantity).toFixed(2)} лв</li>`
                ).join('');
                return `
                    <div class="order-entry">
                        <div class="order-entry-header">
                            <strong>Поръчка #${history.length - idx}</strong>
                            <span>${date}</span>
                        </div>
                        <ul class="order-items-list">${itemRows}</ul>
                        <div class="order-total">Общо: ${(order.total || 0).toFixed(2)} лв</div>
                    </div>`;
            }).join('');
        }

        function doLogout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }

        function initProfile() {
            const user = localStorage.getItem('currentUser');
            if (!user) {
                document.getElementById('guest-view').style.display = 'block';
                return;
            }
            document.getElementById('user-view').style.display = 'block';
            document.getElementById('profile-username').textContent = user;
            const nameEl = document.getElementById('user-name');
            if (nameEl) nameEl.textContent = user + ' ';
            renderProfileCart(user);
            renderOrderHistory(user);
        }

        initProfile();
    </script>

    <script src="auth-global.js"></script>
</body>
</html>
