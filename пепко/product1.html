<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Букет от лалета - Пепко</title>
    <link rel="stylesheet" href="new 1.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%3E%3Ctext%20y%3D%2714%27%20font-size%3D%2716%27%3E%F0%9F%8C%B8%3C%2Ftext%3E%3C%2Fsvg%3E">
</head>
<body>
    <div class="container">
        <header>
            <a href="new 1.html" class="logo">🌹 generation zef</a>
            <nav>
                <ul>
                    <li><a href="new 1.html">БУКЕТИ</a></li>
                    <li><a href="за нас.html">ЗА НАС</a></li>
                    <li><a href="contact.html">КОНТАКТ</a></li>
                    <li><a href="info.html">ИНФО</a></li>
                </ul>
            </nav>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Преглед на продукти..." oninput="filterProducts()">
            </div>
            <div class="auth-icon" onclick="toggleAuth()">
                <span id="user-name"></span> 👤
            </div>
            <a href="cart.html" class="cart-icon">
                <span class="cart-count">0</span>
                🛒
            </a>
        </header>
        <main class="products" style="text-align:center; padding:40px;">
            <h1>Лале-О-Палуза</h1>
            <div class="image-placeholder">
                <img src="779f82d114b7995d4818de3931dbb970.jpg" alt="Букет от лалета" class="product-detail-img">
            </div>
            <p>Слънчево настроение в розово и жълто! ☀️ Тези зефирени лалета носят усмивки и усещане за празник. Подарете емоция, която е едновременно красива и невероятно вкусна.</p>
            <p class="product-price">29.99 лв</p>
            <div class="product-stock" id="stock-1" data-product-id="1"></div>
            <div class="flavour-group">
                <label>Flavour 1:
                    <select id="flavour1">
                        <option>Mango</option>
                        <option>Strawberry</option>
                        <option>Apple</option>
                        <option>Blueberry</option>
                        <option>Lemon</option>
                    </select>
                </label>
                <label>Flavour 2:
                    <select id="flavour2">
                        <option>Mango</option>
                        <option>Strawberry</option>
                        <option>Apple</option>
                        <option>Blueberry</option>
                        <option>Lemon</option>
                    </select>
                </label>
            </div>
            <button class="cta-button" onclick="addToCart(1)">Добави в количка</button>
            <p><a href="new 1.html" class="cta-button" style="background:#777; margin-top:20px;">Назад към магазина</a></p>
        </main>
    </div>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')||'[]');
        function updateCart(){
            const count = cart.reduce((t,i)=>t+i.quantity,0);
            document.querySelector('.cart-count').textContent=count;
        }
        function toggleCart(){
            const modal=document.getElementById('cart-modal');
            if(modal)modal.style.display=modal.style.display==='block'?'none':'block';
        }
        function addToCart(productId){
            const f1 = document.getElementById('flavour1') ? document.getElementById('flavour1').value : '';
            const f2 = document.getElementById('flavour2') ? document.getElementById('flavour2').value : '';
            const image = document.querySelector('.product-detail-img').src;
            const existing=cart.find(i=>i.id===productId && i.flavour1===f1 && i.flavour2===f2);
            if(existing)existing.quantity++;
            else cart.push({id:productId,name:'Букет от лалета',price:29.99,quantity:1,flavour1:f1,flavour2:f2,image:image});
            localStorage.setItem('cart',JSON.stringify(cart));
            updateCart();
            alert('Добавено в количката');
        }
        updateCart();
    </script>

    <script src="inventory-manager.js"></script>
    <script src="dual-prices.js"></script>
    <script src="auth-global.js"></script>
</body>
</html>
